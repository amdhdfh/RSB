<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal Dokter - RSB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md">
        <div class="text-center mb-6">
            <span class="text-4xl">🩺</span>
            <h2 class="text-2xl font-bold text-slate-900 mt-2">Portal Dokter RSB</h2>
            <p class="text-xs text-slate-500 mt-1">Silakan masuk menggunakan akun medis Anda</p>
        </div>

        {{if .error}}
        <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2.5 rounded-lg font-medium">
            {{.error}}
        </div>
        {{end}}

        <form action="/dokter/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Username / NIP</label>
                <input type="text" name="username" required placeholder="Contoh: dr.budi" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm p-2.5 border">
            </div>
            
            <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 transition-colors">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 border-t pt-4">
            Belum terdaftar? <a href="/dokter/register" class="text-blue-600 font-semibold hover:underline">Registrasi Akun Medis</a>
        </div>
    </div>

</body>
</html>
