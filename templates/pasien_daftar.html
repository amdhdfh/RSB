<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Pendaftaran Online Pasien Baru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.step-content { display: none; } .step-content.active { display: block; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div class="max-w-3xl mx-auto py-10 px-4">
        <!-- Header Kemenkes Style -->
        <div class="flex items-center gap-3 mb-8 border-b pb-4">
            <div class="text-green-600 text-3xl font-bold">🏥</div>
            <div>
                <h1 class="text-xl font-bold text-slate-900">Kemenkes</h1>
                <p class="text-sm text-slate-500 font-medium">RSAB Harapan Kita - Pendaftaran Mandiri</p>
            </div>
        </div>

        <!-- Indikator Wizard Progress -->
        <div class="flex justify-between items-center mb-10 text-xs md:text-sm font-semibold text-slate-400">
            <div class="text-center w-1/4 text-blue-600 border-b-2 border-blue-600 pb-2" id="ind-1">1. Data Utama</div>
            <div class="text-center w-1/4 pb-2" id="ind-2">2. Demografi</div>
            <div class="text-center w-1/4 pb-2" id="ind-3">3. Domisili</div>
            <div class="text-center w-1/4 pb-2" id="ind-4">4. Informasi Kontak</div>
        </div>

        <!-- Form Utama -->
        <form action="/pasien/daftar" method="POST" class="bg-white p-8 rounded-2xl border shadow-sm">
            
            <!-- STEP 1: DATA UTAMA -->
            <div class="step-content active" id="step-1">
                <h3 class="text-lg font-bold mb-6 text-slate-900">Langkah 1: Identitas Utama</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium">Nomor Identitas (NIK) *</label>
                        <input type="text" name="nik" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Nama Lengkap Pasien *</label>
                        <input type="text" name="nama_pasien" required class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end mt-8">
                    <button type="button" onclick="nextStep(2)" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700">Berikutnya</button>
                </div>
            </div>

            <!-- STEP 2: DEMOGRAFI -->
            <div class="step-content" id="step-2">
                <h3 class="text-lg font-bold mb-6 text-slate-900">Langkah 2: Data Demografi</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium">Tempat Lahir *</label>
                        <input type="text" name="tempat_lahir" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Tanggal Lahir *</label>
                        <input type="date" name="tanggal_lahir" class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Jenis Kelamin *</label>
                        <select name="jenis_kelamin" class="w-full mt-1 p-2 border rounded-md">
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">Agama *</label>
                        <select name="agama" class="w-full mt-1 p-2 border rounded-md">
                            <option value="Islam">Islam</option><option value="Kristen">Kristen</option><option value="Katolik">Katolik</option><option value="Hindu">Hindu</option><option value="Buddha">Buddha</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">Status Perkawinan *</label>
                        <select name="status_kawin" class="w-full mt-1 p-2 border rounded-md">
                            <option value="Belum Kawin">Belum Kawin</option><option value="Kawin">Kawin</option><option value="Cerai">Cerai</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-sm font-medium">Golongan Darah</label>
                        <select name="gol_darah" class="w-full mt-1 p-2 border rounded-md">
                            <option value="-">-</option><option value="A">A</option><option value="B">B</option><option value="AB">AB</option><option value="O">O</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-between mt-8">
                    <button type="button" onclick="nextStep(1)" class="px-6 py-2 bg-slate-200 text-slate-700 font-medium rounded-md">Sebelumnya</button>
                    <button type="button" onclick="nextStep(3)" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md">Berikutnya</button>
                </div>
            </div>

            <!-- STEP 3: DOMISILI -->
            <div class="step-content" id="step-3">
                <h3 class="text-lg font-bold mb-6 text-slate-900">Langkah 3: Data Domisili & Alamat</h3>
                <div>
                    <label class="text-sm font-medium">Alamat Rumah Tinggal (Sesuai KTP)</label>
                    <textarea name="alamat" class="w-full mt-1 p-2 border rounded-md" rows="3"></textarea>
                </div>
                <div class="flex justify-between mt-8">
                    <button type="button" onclick="nextStep(2)" class="px-6 py-2 bg-slate-200 text-slate-700 font-medium rounded-md">Sebelumnya</button>
                    <button type="button" onclick="nextStep(4)" class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md">Berikutnya</button>
                </div>
            </div>

            <!-- STEP 4: KONTAK -->
            <div class="step-content" id="step-4">
                <h3 class="text-lg font-bold mb-6 text-slate-900">Langkah 4: Informasi Kontak</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm font-medium">Nomor WhatsApp *</label>
                        <input type="text" name="no_whatsapp" required class="w-full mt-1 p-2 border rounded-md">
                    </div>
                    <div>
                        <label class="text-sm font-medium">Alamat Email *</label>
                        <input type="email" name="email" required class="w-full mt-1 p-2 border rounded-md">
                    </div>
                </div>
                <div class="flex justify-between mt-8">
                    <button type="button" onclick="nextStep(3)" class="px-6 py-2 bg-slate-200 text-slate-700 font-medium rounded-md">Sebelumnya</button>
                    <button type="submit" class="px-8 py-2 bg-green-600 text-white font-bold rounded-md hover:bg-green-700">Kirim Pendaftaran</button>
                </div>
            </div>

        </form>
    </div>

    <!-- Script Kontrol Multi-Step Wizard -->
    <script>
        function nextStep(stepNumber) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');
            
            for(let i=1; i<=4; i++) {
                let ind = document.getElementById('ind-' + i);
                if(i === stepNumber) {
                    ind.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
                } else if(i < stepNumber) {
                    ind.classList.remove('text-blue-600', 'border-b-2');
                    ind.classList.add('text-green-600');
                } else {
                    ind.classList.remove('text-blue-600', 'text-green-600', 'border-b-2');
                }
            }
        }
    </script>
</body>
</html>
