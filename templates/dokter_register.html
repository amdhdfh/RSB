<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Dokter Baru - RSB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-200 w-full max-w-md my-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Registrasi Dokter Baru</h2>
            <p class="text-xs text-slate-500 mt-1">Lengkapi data kredensial klinis pelayanan Anda</p>
        </div>

        <form action="/dokter/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Nama Lengkap & Gelar *</label>
                <input type="text" name="nama" required placeholder="Contoh: dr. Budi Santoso, Sp.A" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm text-sm p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Spesialisasi *</label>
                <select name="spesialis" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm text-sm p-2 border">
                    <option value="">-- Pilih Spesialisasi --</option>
                    {{range .spesialis}}
                    <option value="{{.IDSpesialis}}">{{.NamaSpesialis}}</option>
                    {{end}}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">No. Telepon / Whatsapp</label>
                <input type="text" name="telp" placeholder="08123xxxx" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm text-sm p-2 border">
            </div>
            <hr class="my-4 border-slate-200">
            <div>
                <label class="block text-sm font-medium text-slate-700">Username Unik (Untuk Login) *</label>
                <input type="text" name="username" required placeholder="Contoh: budisantoso" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm text-sm p-2 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Password Akun *</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="mt-1 block w-full rounded-md border-slate-300 shadow-sm text-sm p-2 border">
            </div>
            
            <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
                Selesaikan Registrasi
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500 border-t pt-4">
            Sudah punya akun? <a href="/dokter/login" class="text-blue-600 font-semibold hover:underline">Login disini</a>
        </div>
    </div>

</body>
</html>
